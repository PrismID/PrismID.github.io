<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prism ID - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #0f0f1a;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen text-slate-200">

    <div class="w-full max-w-md p-8 bg-slate-900/60 border border-slate-800 rounded-2xl shadow-2xl backdrop-blur-md">
        <div class="flex flex-col items-center mb-8">
            <img src="Prism ID.png" alt="Prism ID logo" height="200" width="200">
            <h1 class="text-3xl font-extrabold text-white tracking-tight">Prism ID</h1>
            <p class="text-slate-400 text-sm mt-1">Create a single username for all your apps.</p>
        </div>

        <form class="space-y-5">
            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Username</label>
                <input type="text" id="username" required
                       class="w-full px-4 py-3 bg-slate-950 border border-slate-800 rounded-xl focus:outline-none focus:border-indigo-500 text-white transition-all">
            </div>

            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Password</label>
                <input type="password" id="password" required
                       class="w-full px-4 py-3 bg-slate-950 border border-slate-800 rounded-xl focus:outline-none focus:border-indigo-500 text-white transition-all">
            </div>

            <div class="pt-2 space-y-3">
                <button type="button" id="login-btn"
                        class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold rounded-xl shadow-lg shadow-indigo-600/20 transition-all transform hover:-translate-y-0.5">
                    Log in
                </button>

                <div class="text-center mt-4">
                    <p class="text-sm text-slate-400">
                        Don't have an account?
                        <a href="loading/" class="text-indigo-400 hover:text-indigo-300 font-medium transition-colors">Sign up.</a>
                    </p>
                </div>
            </div>
        </form>
    </div>

    <script type="module" src="../app.js"></script>
</body>
</html>

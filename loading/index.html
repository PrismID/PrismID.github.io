<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logging In | Prism ID</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        #loading-overlay {
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            padding-top: 10vh;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0f172a; /* Slate-900 */
            z-index: 9999;
        }

        h3 {
            color: white;
            margin-top: 20px;
            font-family: sans-serif;
            font-weight: 500;
            letter-spacing: 0.05em;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen">

    <div id="loading-overlay">
        <img id="animation-frame" src="AnimationFrames/frame1.png" width="300" height="300" alt="Loading...">
        <h3>Logging in with Prism ID</h3>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // 1. Firebase Config (Same as app.js)
        const firebaseConfig = {
            apiKey: "AIzaSyBcyURO4MBB9A1MI2KGV9WEX5TW5zJ29Cg",
            authDomain: "prism-id-10a9d.firebaseapp.com",
            projectId: "prism-id-10a9d",
            storageBucket: "prism-id-10a9d.firebasestorage.app",
            messagingSenderId: "193963126709",
            appId: "1:193963126709:web:ba741a72cb28735f5833fc"
        };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // 2. Animation Logic
        const frameCount = 19;
        const images = [];

        // Preload frames
        for (let i = 1; i <= frameCount; i++) {
            const img = new Image();
            img.src = `AnimationFrames/frame${i}.png`;
            images.push(img);
        }

        function playAnimation() {
            const imgElement = document.getElementById('animation-frame');
            let currentFrame = 0;

            setInterval(() => {
                currentFrame = (currentFrame + 1) % frameCount;
                imgElement.src = images[currentFrame].src;
            }, 50); // Speed of animation (50ms)
        }

        // 3. Auth & SSO Redirect Logic
        onAuthStateChanged(auth, (user) => {
            playAnimation(); // Start animation as soon as page loads

            if (user) {
                // Determine target app
                const params = new URLSearchParams(window.location.search);
                const targetApp = params.get('app'); // e.g., 'voxu'

                const appUrls = {
                    'voxu': 'https://voxuapp.github.io',
                    'whiteboard': 'https://whiteboard-wonders.web.app'
                };

                const destination = appUrls[targetApp];

                // Give the animation 1.5 seconds to play before jumping
                setTimeout(() => {
                    if (destination) {
                        window.location.href = `${destination}?uid=${user.uid}`;
                    } else {
                        // If no app specified, send to dashboard
                        window.location.href = "../dashboard/";
                    }
                }, 1500);

            } else {
                // Not logged in? Send back to index
                setTimeout(() => {
                    window.location.href = "../index.html";
                }, 1000);
            }
        });
    </script>
</body>
</html>
